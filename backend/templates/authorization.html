<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurocircuit | Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }

      /* Technical Background Grid - Subtle for Auth */
      .tech-grid {
          background-image: linear-gradient(#F1F3F5 1px, transparent 1px),
          linear-gradient(to right, #F1F3F5 1px, transparent 1px);
          background-size: 40px 40px;
          mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
          -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
      }

      /* View Transitions */
      .auth-view {
          transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .hidden-view {
          display: none;
          opacity: 0;
          transform: translateY(4px);
      }
      .active-view {
          display: block;
          opacity: 1;
          transform: translateY(0);
      }
    </style>
  </head>
  <body class="bg-white text-slate-700 antialiased h-screen flex flex-col selection:bg-[#8C7AD8] selection:text-white overflow-hidden">
    <!-- Minimal Nav for Context -->
    <nav class="fixed top-0 w-full z-50 px-6 py-6">
      <a href="#" class="opacity-80 hover:opacity-100 transition-opacity">
        <iconify-icon icon="solar:arrow-left-linear" width="24" class="text-slate-400"></iconify-icon>
      </a>
    </nav>

    <!-- Main Auth Content -->
    <main class="flex-1 flex items-center justify-center relative w-full">
      <!-- Background Grid -->
      <div class="absolute inset-0 z-0 pointer-events-none tech-grid opacity-40"></div>

      <!-- Auth Card -->
      <div class="z-10 w-full max-w-[400px] mx-4">
        <div class="bg-white border border-slate-200 rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-8 relative overflow-hidden">
          <!-- Logo Header -->
          <div class="flex justify-center mb-8">
            <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" alt="Neurocircuit" class="w-auto h-8 object-contain">
          </div>

          <!-- LOGIN VIEW -->
          <div id="login-view" class="auth-view active-view">
            <div class="text-center mb-6">
              <h2 class="text-xl font-semibold text-slate-900 tracking-tight">
                Welcome back
              </h2>
              <p class="text-sm text-slate-500 mt-2">
                Enter your credentials to access the fab.
              </p>
            </div>

            <form onsubmit="event.preventDefault();" class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">
                  Email Address
                </label>
                <div class="relative group">
                  <input type="email" placeholder="eng@neurocircuit.io" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
                  <iconify-icon icon="solar:letter-linear" class="absolute right-3 top-3 text-slate-300 pointer-events-none group-focus-within:text-slate-500 transition-colors" width="18"></iconify-icon>
                </div>
              </div>

              <div class="">
                <label class="flex justify-between items-center text-xs font-medium text-slate-500 mb-1.5 ml-0.5">
                  <span>Password</span>
                  <a href="#" onclick="toggleAuth('reset'); return false;" class="bg-gradient-to-r from-[#8C7AD8] to-[#8A88FF] bg-clip-text text-transparent hover:opacity-80 transition-opacity">
                    Forgot?
                  </a>
                </label>
                <div class="relative group">
                  <input type="password" placeholder="••••••••" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
                  <div class="flex gap-2 mt-2 mb-2 ml-0.5 gap-x-2 gap-y-2 items-center">
                    <input id="remember-me" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-green-600 focus:ring-green-500 cursor-pointer">
                    <label for="remember-me" class="text-xs text-slate-500 cursor-pointer select-none">
                      Remember me
                    </label>
                  </div>
                  <button type="button" class="absolute right-3 top-3 text-slate-300 hover:text-slate-500 transition-colors focus:outline-none" onclick="togglePassword(this)">
                    <iconify-icon icon="solar:eye-closed-linear" width="18"></iconify-icon>
                  </button>
                </div>
              </div>

              <button class="w-full bg-gradient-to-r from-[#30A612] to-[#62C749] text-white font-medium text-sm py-2.5 rounded-lg hover:opacity-90 hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2 mt-2">
                Sign In
                <iconify-icon icon="solar:login-2-linear" width="18"></iconify-icon>
              </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
              <p class="text-sm text-slate-500">
                Don't have an account?
                <button onclick="toggleAuth('signup')" class="font-medium bg-gradient-to-r from-[#8C7AD8] to-[#8A88FF] bg-clip-text text-transparent hover:opacity-80 transition-opacity">
                  Create one
                </button>
              </p>
            </div>
          </div>

          <!-- SIGNUP VIEW -->
          <div id="signup-view" class="auth-view hidden-view">
            <div class="text-center mb-6">
              <h2 class="text-xl font-semibold text-slate-900 tracking-tight">
                Create an account
              </h2>
              <!-- Contextual Hint -->
              <div class="mt-3 p-3 bg-slate-50 rounded-lg border border-slate-100 text-left flex gap-3 items-start">
                <iconify-icon icon="solar:shield-check-linear" class="text-[#30A612] shrink-0 mt-0.5" width="16"></iconify-icon>
                <p class="text-xs text-slate-600 leading-relaxed">
                  Complete your profile to securely save your uploaded
                  <strong>Gerber files</strong>
                  and receive your custom quote.
                </p>
              </div>
            </div>

            <form onsubmit="event.preventDefault();" class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">
                  Username
                </label>
                <input type="text" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">
                  Work Email
                </label>
                <input type="email" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">
                    Password
                  </label>
                  <div class="relative">
                    <input type="password" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
                    <button type="button" class="absolute right-3 top-3 text-slate-300 hover:text-slate-500 transition-colors focus:outline-none" onclick="togglePassword(this)">
                      <iconify-icon icon="solar:eye-closed-linear" width="18"></iconify-icon>
                    </button>
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">
                    Confirm
                  </label>
                  <div class="relative">
                    <input type="password" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
                    <button type="button" class="absolute right-3 top-3 text-slate-300 hover:text-slate-500 transition-colors focus:outline-none" onclick="togglePassword(this)">
                      <iconify-icon icon="solar:eye-closed-linear" width="18"></iconify-icon>
                    </button>
                  </div>
                </div>
              </div>

              <div class="flex items-start gap-2 pt-1">
                <div class="flex h-5 items-center">
                  <input id="terms" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-green-600 focus:ring-green-500 cursor-pointer">
                </div>
                <label for="terms" class="text-xs text-slate-500 cursor-pointer select-none">
                  I agree to the
                  <a href="#" class="underline decoration-slate-300 underline-offset-2 hover:text-slate-800">
                    Terms of Service
                  </a>
                  and
                  <a href="#" class="underline decoration-slate-300 underline-offset-2 hover:text-slate-800">
                    NDA Policy
                  </a>
                  .
                </label>
              </div>

              <button class="w-full bg-gradient-to-r from-[#30A612] to-[#62C749] text-white font-medium text-sm py-2.5 rounded-lg hover:opacity-90 hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2 mt-2">
                Create Account
                <iconify-icon icon="solar:user-plus-linear" width="18"></iconify-icon>
              </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
              <p class="text-sm text-slate-500">
                Already have an account?
                <button onclick="toggleAuth('login')" class="font-medium bg-gradient-to-r from-[#8C7AD8] to-[#8A88FF] bg-clip-text text-transparent hover:opacity-80 transition-opacity">
                  Sign In
                </button>
              </p>
            </div>
          </div>

          <!-- RESET PASSWORD VIEW -->
          <div id="reset-view" class="auth-view hidden-view">
            <div class="text-center mb-6">
              <h2 class="text-xl font-semibold text-slate-900 tracking-tight">
                Reset Password
              </h2>
              <p class="text-sm text-slate-500 mt-2">
                Enter your email and new password.
              </p>
            </div>

            <form onsubmit="event.preventDefault();" class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">
                  Email Address
                </label>
                <input type="email" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">
                  Confirmation Code
                </label>
                <input type="text" placeholder="123456" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm tracking-widest">
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">
                  New Password
                </label>
                <div class="relative">
                  <input type="password" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
                  <button type="button" class="absolute right-3 top-3 text-slate-300 hover:text-slate-500 transition-colors focus:outline-none" onclick="togglePassword(this)">
                    <iconify-icon icon="solar:eye-closed-linear" width="18"></iconify-icon>
                  </button>
                </div>
              </div>

              <button class="w-full bg-gradient-to-r from-[#30A612] to-[#62C749] text-white font-medium text-sm py-2.5 rounded-lg hover:opacity-90 hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2 mt-2">
                Update Password
                <iconify-icon icon="solar:check-circle-linear" width="18"></iconify-icon>
              </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
              <button onclick="toggleAuth('login')" class="text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors flex items-center justify-center gap-2 w-full">
                <iconify-icon icon="solar:arrow-left-linear" width="16"></iconify-icon>
                Back to Sign In
              </button>
            </div>
          </div>

        </div>

        <!-- Footer Links -->
        <div class="mt-8 text-center flex justify-center gap-6 text-xs text-slate-400">
          <a href="#" class="hover:text-slate-600 transition-colors">
            Enterprise
          </a>
          <a href="#" class="hover:text-slate-600 transition-colors">Docs</a>
          <a href="#" class="hover:text-slate-600 transition-colors">Contact</a>
        </div>
      </div>
    </main>

    <script>
      function toggleAuth(view) {
        ['login-view', 'signup-view', 'reset-view'].forEach(id => {
          const el = document.getElementById(id);
          if (!el) return;
          if (id === view + '-view') {
            el.classList.replace('hidden-view', 'active-view');
          } else {
            el.classList.replace('active-view', 'hidden-view');
          }
        });
      }

      function togglePassword(btn) {
        const input = btn.previousElementSibling;
        const icon = btn.querySelector('iconify-icon');
        if (input.type === 'password') {
          input.type = 'text';
          icon.setAttribute('icon', 'solar:eye-bold');
        } else {
          input.type = 'password';
          icon.setAttribute('icon', 'solar:eye-closed-linear');
        }
      }
    </script>
  
</body></html>
