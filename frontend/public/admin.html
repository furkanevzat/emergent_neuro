<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurocircuit | Admin Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 500;
        border: 1px solid transparent;
      }
      .badge-yellow { background-color: #FEFCE8; color: #854D0E; border-color: #FEF9C3; }
      .badge-green { background-color: #F0FDF4; color: #15803D; border-color: #DCFCE7; }
      .badge-blue { background-color: #EFF6FF; color: #1E40AF; border-color: #DBEAFE; }
    </style>
    <script src="/js-api-client.js"></script>
</head>
<body class="bg-[#F8F9FA] text-slate-800">
    <nav class="fixed top-0 w-full z-50 bg-white border-b border-[#E1E4E8]">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 bg-slate-900 rounded-[4px] flex items-center justify-center text-white">
            <span class="font-bold text-xs">N</span>
          </div>
          <span class="font-semibold text-sm tracking-tight text-slate-900">Neurocircuit Admin</span>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-sm text-slate-600" id="admin-name">Loading...</span>
          <button onclick="logout()" class="text-sm font-medium text-slate-600 hover:text-slate-900">Logout</button>
        </div>
      </div>
    </nav>

    <main class="pt-24 pb-20">
      <div class="max-w-7xl mx-auto px-4">
        <div class="mb-8">
          <h1 class="text-2xl font-semibold text-slate-900">Order Review Queue</h1>
          <p class="text-sm text-slate-500 mt-1">Review and price PCB orders for production pooling</p>
        </div>

        <div class="bg-white rounded-xl border border-[#E1E4E8] overflow-hidden">
          <table class="min-w-full divide-y divide-[#E1E4E8]">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Order ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">User</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Specs</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Submitted</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Status</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Price</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Actions</th>
              </tr>
            </thead>
            <tbody id="orders-table" class="bg-white divide-y divide-[#E1E4E8]">
              <tr>
                <td colspan="7" class="px-6 py-8 text-center text-sm text-slate-500">Loading orders...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Update Order Modal -->
    <div id="update-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4">
        <h3 class="text-lg font-semibold text-slate-900 mb-4">Update Order</h3>
        <form id="update-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Status</label>
            <select id="update-status" class="w-full px-3 py-2 border border-slate-200 rounded-lg">
              <option value="reviewing">Reviewing</option>
              <option value="quoted">Quoted</option>
              <option value="production">Production</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Price (USD)</label>
            <input type="number" id="update-price" step="0.01" min="0" class="w-full px-3 py-2 border border-slate-200 rounded-lg" placeholder="0.00">
          </div>
          <div class="flex justify-end gap-3 mt-6">
            <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
              Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700">
              Update Order
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      if (!requireAuth()) {
        // Will redirect if not authenticated
      }

      const user = getUser();
      if (user) {
        if (user.role !== 'staff') {
          alert('Access denied. Staff access required.');
          window.location.href = '/home.html';
        }
        document.getElementById('admin-name').textContent = user.name;
      }

      let currentOrderId = null;

      async function loadOrders() {
        try {
          const response = await apiCall('/api/orders/all/list');
          if (!response) return;
          
          const orders = await response.json();
          const tbody = document.getElementById('orders-table');
          
          if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-sm text-slate-500">No orders yet</td></tr>';
            return;
          }

          // Get user names
          const userMap = {};
          for (const order of orders) {
            if (!userMap[order.user_id]) {
              const userResponse = await fetch(`${API_BASE}/api/auth/me`, {
                headers: { 'Authorization': `Bearer ${getToken()}` }
              });
              // For now, just show user ID
              userMap[order.user_id] = order.user_id.substring(0, 8);
            }
          }
          
          tbody.innerHTML = orders.map(order => `
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="text-sm font-mono font-medium text-slate-900">#${order.order_id}</span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="text-sm text-slate-600">${userMap[order.user_id] || 'Unknown'}</span>
              </td>
              <td class="px-6 py-4">
                <div class="text-xs text-slate-600">
                  ${order.specs.layers}L • ${order.specs.thickness} • ${order.specs.quantity} pcs<br/>
                  ${order.specs.finish}
                </div>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="text-xs text-slate-600">${formatDate(order.submitted_at)}</span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                ${getStatusBadge(order.status)}
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="text-sm font-mono font-semibold text-slate-900">
                  ${order.price > 0 ? `$${order.price.toFixed(2)}` : '—'}
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <button onclick="openUpdateModal('${order.order_id}', '${order.status}', ${order.price})" 
                        class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                  Update
                </button>
                ${order.gerber_file ? `<a href="${API_BASE}/uploads/${order.gerber_file}" download class="ml-3 text-sm text-green-600 hover:text-green-800 font-medium">Download</a>` : ''}
              </td>
            </tr>
          `).join('');
        } catch (error) {
          console.error('Error loading orders:', error);
        }
      }

      function openUpdateModal(orderId, status, price) {
        currentOrderId = orderId;
        document.getElementById('update-status').value = status;
        document.getElementById('update-price').value = price || '';
        document.getElementById('update-modal').classList.remove('hidden');
      }

      function closeModal() {
        document.getElementById('update-modal').classList.add('hidden');
        currentOrderId = null;
      }

      document.getElementById('update-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const status = document.getElementById('update-status').value;
        const price = parseFloat(document.getElementById('update-price').value) || 0;

        try {
          const response = await apiCall(`/api/orders/${currentOrderId}`, {
            method: 'PATCH',
            body: JSON.stringify({ status, price })
          });

          if (response && response.ok) {
            closeModal();
            loadOrders();
          } else {
            alert('Failed to update order');
          }
        } catch (error) {
          console.error('Error updating order:', error);
          alert('Error updating order');
        }
      });

      loadOrders();
    </script>
</body>
</html>
