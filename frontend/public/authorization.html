<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurocircuit | Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .tech-grid {
          background-image: linear-gradient(#F1F3F5 1px, transparent 1px),
          linear-gradient(to right, #F1F3F5 1px, transparent 1px);
          background-size: 40px 40px;
          mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
          -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
      }
      .auth-view {
          transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .hidden-view {
          display: none;
          opacity: 0;
          transform: translateY(4px);
      }
      .active-view {
          display: block;
          opacity: 1;
          transform: translateY(0);
      }
    </style>
</head>
<body class="bg-white text-slate-700 antialiased h-screen flex flex-col selection:bg-[#8C7AD8] selection:text-white overflow-hidden">
    <nav class="fixed top-0 w-full z-50 px-6 py-6">
      <a href="/" class="opacity-80 hover:opacity-100 transition-opacity">
        <iconify-icon icon="solar:arrow-left-linear" width="24" class="text-slate-400"></iconify-icon>
      </a>
    </nav>

    <main class="flex-1 flex items-center justify-center relative w-full">
      <div class="absolute inset-0 z-0 pointer-events-none tech-grid opacity-40"></div>

      <div class="z-10 w-full max-w-[400px] mx-4">
        <div class="bg-white border border-slate-200 rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-8 relative overflow-hidden">
          <div class="flex justify-center mb-8">
            <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" alt="Neurocircuit" class="w-auto h-8 object-contain">
          </div>

          <!-- LOGIN VIEW -->
          <div id="login-view" class="auth-view active-view">
            <div class="text-center mb-6">
              <h2 class="text-xl font-semibold text-slate-900 tracking-tight">Welcome back</h2>
              <p class="text-sm text-slate-500 mt-2">Enter your credentials to access the fab.</p>
            </div>

            <form id="login-form" class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">Email Address</label>
                <input type="email" id="login-email" name="email" required placeholder="eng@neurocircuit.io" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">Password</label>
                <input type="password" id="login-password" name="password" required placeholder="••••••••" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
              </div>

              <div id="login-error" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>

              <button type="submit" data-testid="login-submit-btn" class="w-full bg-gradient-to-r from-[#30A612] to-[#62C749] text-white font-medium text-sm py-2.5 rounded-lg hover:opacity-90 hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2 mt-2">
                Sign In
                <iconify-icon icon="solar:login-2-linear" width="18"></iconify-icon>
              </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
              <p class="text-sm text-slate-500">
                Don't have an account?
                <button onclick="toggleAuth('signup')" class="font-medium bg-gradient-to-r from-[#8C7AD8] to-[#8A88FF] bg-clip-text text-transparent hover:opacity-80 transition-opacity">
                  Create one
                </button>
              </p>
            </div>
          </div>

          <!-- SIGNUP VIEW -->
          <div id="signup-view" class="auth-view hidden-view">
            <div class="text-center mb-6">
              <h2 class="text-xl font-semibold text-slate-900 tracking-tight">Create an account</h2>
              <div class="mt-3 p-3 bg-slate-50 rounded-lg border border-slate-100 text-left flex gap-3 items-start">
                <iconify-icon icon="solar:shield-check-linear" class="text-[#30A612] shrink-0 mt-0.5" width="16"></iconify-icon>
                <p class="text-xs text-slate-600 leading-relaxed">
                  Complete your profile to securely save your uploaded <strong>Gerber files</strong> and receive your custom quote.
                </p>
              </div>
            </div>

            <form id="signup-form" class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">Full Name</label>
                <input type="text" id="signup-name" name="name" required class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">Work Email</label>
                <input type="email" id="signup-email" name="email" required class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5 ml-0.5">Password</label>
                <input type="password" id="signup-password" name="password" required minlength="6" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-sm">
              </div>

              <div id="signup-error" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>

              <button type="submit" data-testid="signup-submit-btn" class="w-full bg-gradient-to-r from-[#8C7AD8] to-[#8A88FF] text-white font-medium text-sm py-2.5 rounded-lg hover:opacity-90 hover:shadow-md transition-all duration-200">
                Create Account
              </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
              <p class="text-sm text-slate-500">
                Already have an account?
                <button onclick="toggleAuth('login')" class="font-medium bg-gradient-to-r from-[#30A612] to-[#62C749] bg-clip-text text-transparent hover:opacity-80 transition-opacity">
                  Sign in
                </button>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      function toggleAuth(view) {
        const loginView = document.getElementById('login-view');
        const signupView = document.getElementById('signup-view');
        
        if (view === 'signup') {
          loginView.classList.remove('active-view');
          loginView.classList.add('hidden-view');
          signupView.classList.remove('hidden-view');
          signupView.classList.add('active-view');
        } else {
          signupView.classList.remove('active-view');
          signupView.classList.add('hidden-view');
          loginView.classList.remove('hidden-view');
          loginView.classList.add('active-view');
        }
      }

      // Login form handler
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('login-error');
        errorDiv.classList.add('hidden');

        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (response.ok) {
            // Store token in cookie
            document.cookie = `access_token=${data.access_token}; path=/; max-age=${7*24*60*60}`;
            // Redirect to dashboard
            window.location.href = '/dashboard';
          } else {
            errorDiv.textContent = data.detail || 'Login failed';
            errorDiv.classList.remove('hidden');
          }
        } catch (error) {
          errorDiv.textContent = 'Network error. Please try again.';
          errorDiv.classList.remove('hidden');
        }
      });

      // Signup form handler
      document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('signup-error');
        errorDiv.classList.add('hidden');

        const name = document.getElementById('signup-name').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;

        try {
          const response = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });

          const data = await response.json();

          if (response.ok) {
            // Store token in cookie
            document.cookie = `access_token=${data.access_token}; path=/; max-age=${7*24*60*60}`;
            // Redirect to dashboard
            window.location.href = '/dashboard';
          } else {
            errorDiv.textContent = data.detail || 'Signup failed';
            errorDiv.classList.remove('hidden');
          }
        } catch (error) {
          errorDiv.textContent = 'Network error. Please try again.';
          errorDiv.classList.remove('hidden');
        }
      });
    </script>
</body>
</html>
