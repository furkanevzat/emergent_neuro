<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurocircuit | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #e1e4e8; border-radius: 3px; }
      .btn-primary { background: linear-gradient(90deg, #30a612 0%, #62c749 100%); }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 500;
        border: 1px solid transparent;
      }
      .badge-yellow { background-color: #FEFCE8; color: #854D0E; border-color: #FEF9C3; }
      .badge-green { background-color: #F0FDF4; color: #15803D; border-color: #DCFCE7; }
      .badge-blue { background-color: #EFF6FF; color: #1E40AF; border-color: #DBEAFE; }
      .badge-gray { background-color: #F8F9FA; color: #475569; border-color: #E2E8F0; }
    </style>
    <script src="/js-api-client.js"></script>
</head>
<body class="bg-[#F8F9FA] text-slate-800 h-screen flex overflow-hidden font-inter">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-[#E1E4E8] flex flex-col h-full flex-shrink-0 z-20">
      <div class="flex h-14 border-[#E1E4E8] border-b pr-4 pl-4 items-center">
        <a href="/home.html" class="flex items-center gap-2">
          <div class="w-6 h-6 bg-slate-900 rounded-[4px] flex items-center justify-center text-white">
            <span class="font-bold text-xs">N</span>
          </div>
          <span class="font-semibold text-sm tracking-tight text-slate-900">Neurocircuit</span>
        </a>
      </div>

      <nav class="flex-1 overflow-y-auto pt-4 pr-2 pb-2 pl-2 space-y-1">
        <a href="/client-dashboard.html" data-testid="dashboard-nav-btn" class="w-full flex items-center gap-3 px-3 py-2 text-xs font-medium rounded-[4px] bg-[#f0fdf4] border border-[#DCFCE7] text-[#15803d]">
          <iconify-icon icon="solar:widget-linear" width="16"></iconify-icon>
          Dashboard
        </a>
        <a href="/client-order-configuration.html" data-testid="new-order-nav-btn" class="w-full flex items-center gap-3 px-3 py-2 text-xs font-medium rounded-[4px] text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-colors">
          <iconify-icon icon="solar:add-circle-linear" width="16"></iconify-icon>
          New Order
        </a>
        <button onclick="logout()" data-testid="logout-btn" class="w-full flex items-center gap-3 px-3 py-2 text-xs font-medium rounded-[4px] text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-colors">
          <iconify-icon icon="solar:logout-linear" width="16"></iconify-icon>
          Logout
        </button>
      </nav>

      <div class="p-3 border-t border-[#E1E4E8]" id="user-profile">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-slate-100 border border-[#E1E4E8] flex items-center justify-center">
            <span class="text-xs font-bold text-slate-600" id="user-initials">--</span>
          </div>
          <div class="flex flex-col">
            <span class="text-xs font-medium text-slate-900" id="user-name">Loading...</span>
            <span class="text-[10px] text-slate-500" id="user-email">--</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-white">
      <header class="border-b border-[#E1E4E8] px-8 py-5 flex items-center justify-between bg-white sticky top-0 z-10">
        <div class="flex flex-col gap-1">
          <h1 class="text-xl font-semibold text-slate-900 tracking-tight" id="welcome-msg">Welcome back</h1>
          <p class="text-xs text-slate-500">Here is an overview of your recent activity.</p>
        </div>

        <div class="flex items-center gap-3">
          <a href="/client-order-configuration.html" data-testid="new-prototype-btn" class="btn-primary text-white text-xs font-medium px-4 py-2 rounded-[4px] shadow-sm hover:opacity-90 transition-opacity flex items-center gap-2">
            <iconify-icon icon="solar:add-circle-linear" width="16"></iconify-icon>
            New Prototype
          </a>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto">
        <div class="min-w-full inline-block align-middle">
          <div class="border-b border-[#E1E4E8]">
            <table class="min-w-full divide-y divide-[#E1E4E8]">
              <thead class="bg-white sticky top-0 z-10">
                <tr>
                  <th class="px-8 py-3 text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Order ID</th>
                  <th class="px-8 py-3 text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Specifications</th>
                  <th class="px-8 py-3 text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Date Submitted</th>
                  <th class="px-8 py-3 text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Status</th>
                  <th class="px-8 py-3 text-right text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Total</th>
                </tr>
              </thead>
              <tbody id="orders-table" class="bg-white divide-y divide-[#E1E4E8]">
                <tr>
                  <td colspan="5" class="px-8 py-8 text-center text-sm text-slate-500">Loading orders...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Check auth
      if (!requireAuth()) {
        // Will redirect if not authenticated
      }

      // Load user data
      const user = getUser();
      if (user) {
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-initials').textContent = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        document.getElementById('welcome-msg').textContent = `Welcome back, ${user.name.split(' ')[0]}`;
      }

      // Load orders
      async function loadOrders() {
        try {
          const response = await apiCall('/api/orders');
          if (!response) return;
          
          const orders = await response.json();
          const tbody = document.getElementById('orders-table');
          
          if (orders.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="5" class="px-8 py-12 text-center">
                  <div class="flex flex-col items-center gap-3">
                    <iconify-icon icon="solar:box-linear" width="48" class="text-slate-300"></iconify-icon>
                    <div>
                      <p class="text-sm font-medium text-slate-900">No orders yet</p>
                      <p class="text-xs text-slate-500 mt-1">Create your first PCB prototype order to get started</p>
                    </div>
                    <a href="/client-order-configuration.html" class="btn-primary text-white text-xs font-medium px-4 py-2 rounded-[4px] shadow-sm hover:opacity-90 transition-opacity mt-2">
                      Create Order
                    </a>
                  </div>
                </td>
              </tr>
            `;
            return;
          }
          
          tbody.innerHTML = orders.map(order => `
            <tr class="hover:bg-[#F8F9FA] transition-colors" data-testid="order-row-${order.order_id}">
              <td class="px-8 py-4 whitespace-nowrap">
                <span class="text-xs font-mono font-medium text-slate-900">#${order.order_id}</span>
              </td>
              <td class="px-8 py-4">
                <div class="text-xs text-slate-600">
                  ${order.specs.layers}L • ${order.specs.thickness} • ${order.specs.quantity} pcs
                </div>
              </td>
              <td class="px-8 py-4 whitespace-nowrap">
                <span class="text-xs text-slate-600">${formatDate(order.submitted_at)}</span>
              </td>
              <td class="px-8 py-4 whitespace-nowrap">
                ${getStatusBadge(order.status)}
              </td>
              <td class="px-8 py-4 whitespace-nowrap text-right">
                <span class="text-xs font-mono font-semibold text-slate-900">
                  ${order.price > 0 ? `$${order.price.toFixed(2)}` : 'Pending'}
                </span>
              </td>
            </tr>
          `).join('');
        } catch (error) {
          console.error('Error loading orders:', error);
          document.getElementById('orders-table').innerHTML = `
            <tr>
              <td colspan="5" class="px-8 py-8 text-center text-sm text-red-600">
                Error loading orders. Please refresh the page.
              </td>
            </tr>
          `;
        }
      }

      // Load orders on page load
      loadOrders();
    </script>
</body>
</html>
