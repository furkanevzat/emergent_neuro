<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurocircuit | New Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .btn-primary { background: linear-gradient(90deg, #30a612 0%, #62c749 100%); }
    </style>
    <script src="/js-api-client.js"></script>
</head>
<body class="bg-[#F8F9FA] text-slate-800">
    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-[#E1E4E8]">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <a href="/home.html" class="flex items-center gap-2">
          <div class="w-6 h-6 bg-slate-900 rounded-[4px] flex items-center justify-center text-white">
            <span class="font-bold text-xs">N</span>
          </div>
          <span class="font-semibold text-sm tracking-tight text-slate-900">Neurocircuit</span>
        </a>
        <div class="flex items-center gap-4">
          <a href="/client-dashboard.html" class="text-sm font-medium text-slate-600 hover:text-slate-900">Dashboard</a>
          <button onclick="logout()" class="text-sm font-medium text-slate-600 hover:text-slate-900">Logout</button>
        </div>
      </div>
    </nav>

    <main class="pt-24 pb-20 max-w-4xl mx-auto px-4">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-semibold text-slate-900 mb-2">Configure Your PCB Order</h1>
        <p class="text-sm text-slate-500">Specify your requirements and upload Gerber files</p>
      </div>

      <form id="order-form" class="bg-white rounded-xl border border-[#E1E4E8] shadow-xl p-8">
        <!-- File Upload -->
        <div class="mb-8">
          <label class="block text-sm font-semibold text-slate-900 mb-4">Gerber Files (Optional)</label>
          <div class="border-2 border-dashed border-slate-200 rounded-lg p-8 text-center hover:border-[#30A612] transition-colors cursor-pointer" id="drop-zone">
            <input type="file" id="gerber-file" accept=".zip,.rar" class="hidden">
            <iconify-icon icon="solar:cloud-upload-linear" width="48" class="text-slate-300 mb-3"></iconify-icon>
            <p class="text-sm font-medium text-slate-900 mb-1">Drop Gerber archive here</p>
            <p class="text-xs text-slate-500">or click to browse (.zip or .rar, max 50MB)</p>
            <div id="file-info" class="hidden mt-4 p-3 bg-green-50 border border-green-200 rounded-lg">
              <p class="text-sm font-medium text-green-900" id="file-name"></p>
            </div>
          </div>
        </div>

        <!-- Specifications Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
          <!-- Material -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Substrate</label>
            <select name="substrate" data-testid="substrate-select" class="w-full px-3 py-2.5 bg-white border border-[#E1E4E8] rounded-lg text-sm focus:outline-none focus:border-[#30A612] focus:ring-1 focus:ring-[#30A612]">
              <option>FR-4 Standard (TG150)</option>
              <option>FR-4 High TG (TG170)</option>
              <option>Aluminum Core</option>
              <option>Rogers 4350B</option>
            </select>
          </div>

          <!-- Layers -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Layers</label>
            <select name="layers" data-testid="layers-select" class="w-full px-3 py-2.5 bg-white border border-[#E1E4E8] rounded-lg text-sm focus:outline-none focus:border-[#30A612] focus:ring-1 focus:ring-[#30A612]">
              <option value="2">2 Layers</option>
              <option value="4">4 Layers</option>
              <option value="6">6 Layers</option>
              <option value="8">8 Layers</option>
            </select>
          </div>

          <!-- Thickness -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Thickness</label>
            <select name="thickness" data-testid="thickness-select" class="w-full px-3 py-2.5 bg-white border border-[#E1E4E8] rounded-lg text-sm focus:outline-none focus:border-[#30A612] focus:ring-1 focus:ring-[#30A612]">
              <option>0.6 mm</option>
              <option>0.8 mm</option>
              <option>1.0 mm</option>
              <option>1.2 mm</option>
              <option selected>1.6 mm</option>
              <option>2.0 mm</option>
            </select>
          </div>

          <!-- Quantity -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Quantity</label>
            <input type="number" name="quantity" data-testid="quantity-input" value="10" min="5" max="100" step="5" class="w-full px-3 py-2.5 bg-white border border-[#E1E4E8] rounded-lg text-sm focus:outline-none focus:border-[#30A612] focus:ring-1 focus:ring-[#30A612]">
          </div>

          <!-- Finish -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Surface Finish</label>
            <select name="finish" data-testid="finish-select" class="w-full px-3 py-2.5 bg-white border border-[#E1E4E8] rounded-lg text-sm focus:outline-none focus:border-[#30A612] focus:ring-1 focus:ring-[#30A612]">
              <option>HASL (Lead-Free)</option>
              <option>ENIG (Immersion Gold)</option>
              <option>OSP</option>
              <option>Hard Gold</option>
            </select>
          </div>

          <!-- Mask Color -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Solder Mask</label>
            <select name="mask_color" data-testid="mask-color-select" class="w-full px-3 py-2.5 bg-white border border-[#E1E4E8] rounded-lg text-sm focus:outline-none focus:border-[#30A612] focus:ring-1 focus:ring-[#30A612]">
              <option>Green</option>
              <option>Blue</option>
              <option>Red</option>
              <option>Black</option>
              <option>White</option>
            </select>
          </div>

          <!-- Silkscreen -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Silkscreen</label>
            <select name="silkscreen" data-testid="silkscreen-select" class="w-full px-3 py-2.5 bg-white border border-[#E1E4E8] rounded-lg text-sm focus:outline-none focus:border-[#30A612] focus:ring-1 focus:ring-[#30A612]">
              <option>White</option>
              <option>Black</option>
            </select>
          </div>

          <!-- Copper Weight -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Copper Weight</label>
            <select name="copper_weight" data-testid="copper-weight-select" class="w-full px-3 py-2.5 bg-white border border-[#E1E4E8] rounded-lg text-sm focus:outline-none focus:border-[#30A612] focus:ring-1 focus:ring-[#30A612]">
              <option>1oz</option>
              <option>2oz</option>
            </select>
          </div>
        </div>

        <div id="error-msg" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-600"></div>
        <div id="success-msg" class="hidden mb-6 p-4 bg-green-50 border border-green-200 rounded-lg text-sm text-green-600"></div>

        <div class="flex justify-end gap-4">
          <a href="/client-dashboard.html" class="px-6 py-2.5 border border-[#E1E4E8] rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors">
            Cancel
          </a>
          <button type="submit" data-testid="submit-order-btn" class="btn-primary text-white px-6 py-2.5 rounded-lg text-sm font-medium hover:opacity-90 transition-opacity">
            Submit for Review
          </button>
        </div>
      </form>
    </main>

    <script>
      if (!requireAuth()) {
        // Will redirect if not authenticated
      }

      let selectedFile = null;

      // File upload handling
      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('gerber-file');
      const fileInfo = document.getElementById('file-info');
      const fileName = document.getElementById('file-name');

      dropZone.addEventListener('click', () => fileInput.click());

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-[#30A612]', 'bg-green-50');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('border-[#30A612]', 'bg-green-50');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-[#30A612]', 'bg-green-50');
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          handleFile(files[0]);
        }
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFile(e.target.files[0]);
        }
      });

      function handleFile(file) {
        if (file.size > 50 * 1024 * 1024) {
          alert('File size exceeds 50MB limit');
          return;
        }
        selectedFile = file;
        fileName.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        fileInfo.classList.remove('hidden');
      }

      // Form submission
      document.getElementById('order-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const submitBtn = e.target.querySelector('button[type="submit"]');
        
        errorMsg.classList.add('hidden');
        successMsg.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        try {
          const formData = new FormData();
          
          // Collect specs
          const specs = {
            substrate: e.target.substrate.value,
            layers: parseInt(e.target.layers.value),
            thickness: e.target.thickness.value,
            quantity: parseInt(e.target.quantity.value),
            finish: e.target.finish.value,
            mask_color: e.target.mask_color.value,
            silkscreen: e.target.silkscreen.value,
            copper_weight: e.target.copper_weight.value
          };

          formData.append('specs', JSON.stringify(specs));
          
          if (selectedFile) {
            formData.append('gerber_file', selectedFile);
          }

          const token = getToken();
          const response = await fetch(`${API_BASE}/api/orders`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`
            },
            body: formData
          });

          const data = await response.json();

          if (response.ok) {
            successMsg.textContent = `Order ${data.order_id} created successfully! Redirecting to dashboard...`;
            successMsg.classList.remove('hidden');
            setTimeout(() => {
              window.location.href = '/client-dashboard.html';
            }, 2000);
          } else {
            errorMsg.textContent = data.detail || 'Failed to create order';
            errorMsg.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit for Review';
          }
        } catch (error) {
          console.error('Error:', error);
          errorMsg.textContent = 'Network error. Please try again.';
          errorMsg.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit for Review';
        }
      });
    </script>
</body>
</html>
