<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurocircuit | Order Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge-yellow { background-color: #FEFCE8; color: #854D0E; border: 1px solid #FEF9C3; }
      .badge-green { background-color: #F0FDF4; color: #15803D; border: 1px solid #DCFCE7; }
      .badge-blue { background-color: #EFF6FF; color: #1E40AF; border: 1px solid #DBEAFE; }
      .info-card { background: white; border: 1px solid #E1E4E8; border-radius: 12px; padding: 24px; }
      .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F1F3F5; }
      .info-row:last-child { border-bottom: none; }
    </style>
</head>
<body class="bg-[#F8F9FA] text-slate-800">
    <nav class="fixed top-0 w-full z-50 bg-white border-b border-[#E1E4E8]">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <a href="/client-dashboard.html" class="flex items-center gap-2 text-sm text-slate-600 hover:text-slate-900">
          <iconify-icon icon="solar:arrow-left-linear" width="20"></iconify-icon>
          Back to Dashboard
        </a>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 bg-slate-900 rounded-[4px] flex items-center justify-center text-white">
            <span class="font-bold text-xs">N</span>
          </div>
          <span class="font-semibold text-sm tracking-tight text-slate-900">Neurocircuit</span>
        </div>
      </div>
    </nav>

    <main class="pt-24 pb-20 max-w-5xl mx-auto px-4">
      <div class="mb-8">
        <div class="flex items-center justify-between mb-2">
          <h1 class="text-2xl font-semibold text-slate-900" id="order-title">Loading...</h1>
          <span id="order-status-badge"></span>
        </div>
        <p class="text-sm text-slate-500" id="order-date"></p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Main Details -->
        <div class="lg:col-span-2 space-y-6">
          <!-- PCB Specifications -->
          <div class="info-card">
            <h2 class="text-lg font-semibold text-slate-900 mb-4">PCB Specifications</h2>
            <div id="specs-container">
              <div class="text-center py-8 text-slate-500">Loading specifications...</div>
            </div>
          </div>

          <!-- Gerber Analysis -->
          <div class="info-card" id="analysis-card">
            <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
              <iconify-icon icon="solar:widget-2-linear" width="24" class="text-green-600"></iconify-icon>
              Gerber File Analysis
            </h2>
            <div id="analysis-container">
              <div class="text-center py-8 text-slate-500">Loading analysis...</div>
            </div>
          </div>
        </div>

        <!-- Pricing & Actions -->
        <div class="space-y-6">
          <!-- Price Card -->
          <div class="info-card">
            <h2 class="text-lg font-semibold text-slate-900 mb-4">Pricing</h2>
            <div id="pricing-container">
              <div class="text-center py-4 text-slate-500">Loading pricing...</div>
            </div>
          </div>

          <!-- Download Card -->
          <div class="info-card" id="download-card" style="display:none;">
            <h2 class="text-lg font-semibold text-slate-900 mb-4">Files</h2>
            <a id="download-link" href="#" download class="flex items-center justify-center gap-2 w-full bg-green-600 text-white font-medium text-sm py-3 rounded-lg hover:bg-green-700 transition-colors">
              <iconify-icon icon="solar:download-linear" width="20"></iconify-icon>
              Download Gerber Files
            </a>
          </div>
        </div>
      </div>
    </main>

    <script>
      const API_BASE = 'https://pcb-pool.preview.emergentagent.com';
      
      function getToken() {
        return localStorage.getItem('access_token');
      }

      // Get order ID from URL
      const pathParts = window.location.pathname.split('/');
      const orderIdIndex = pathParts.indexOf('orders') + 1;
      const orderId = pathParts[orderIdIndex];

      function getStatusBadge(status) {
        const badges = {
          reviewing: '<span class="badge badge-yellow">Reviewing</span>',
          quoted: '<span class="badge badge-blue">Quoted</span>',
          production: '<span class="badge badge-blue">Production</span>',
          shipped: '<span class="badge badge-green">Shipped</span>',
          delivered: '<span class="badge badge-green">Delivered</span>'
        };
        return badges[status] || `<span class="badge">${status}</span>`;
      }

      function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-US', { 
          month: 'long', 
          day: 'numeric', 
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      async function loadOrderDetails() {
        try {
          const response = await fetch(`${API_BASE}/api/orders/${orderId}`, {
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });

          if (!response.ok) {
            throw new Error('Order not found');
          }

          const order = await response.json();

          // Update header
          document.getElementById('order-title').textContent = `Order #${order.order_id}`;
          document.getElementById('order-status-badge').innerHTML = getStatusBadge(order.status);
          document.getElementById('order-date').textContent = `Submitted on ${formatDate(order.submitted_at)}`;

          // Render specifications
          const specs = order.specs;
          document.getElementById('specs-container').innerHTML = `
            <div class="info-row">
              <span class="text-sm text-slate-600">Layers</span>
              <span class="text-sm font-semibold text-slate-900">${specs.layers} Layers</span>
            </div>
            <div class="info-row">
              <span class="text-sm text-slate-600">Substrate</span>
              <span class="text-sm font-semibold text-slate-900">${specs.substrate}</span>
            </div>
            <div class="info-row">
              <span class="text-sm text-slate-600">Thickness</span>
              <span class="text-sm font-semibold text-slate-900">${specs.thickness}</span>
            </div>
            <div class="info-row">
              <span class="text-sm text-slate-600">Quantity</span>
              <span class="text-sm font-semibold text-slate-900">${specs.quantity} pieces</span>
            </div>
            <div class="info-row">
              <span class="text-sm text-slate-600">Surface Finish</span>
              <span class="text-sm font-semibold text-slate-900">${specs.finish}</span>
            </div>
            <div class="info-row">
              <span class="text-sm text-slate-600">Solder Mask</span>
              <span class="text-sm font-semibold text-slate-900">${specs.mask_color}</span>
            </div>
            <div class="info-row">
              <span class="text-sm text-slate-600">Silkscreen</span>
              <span class="text-sm font-semibold text-slate-900">${specs.silkscreen}</span>
            </div>
            <div class="info-row">
              <span class="text-sm text-slate-600">Copper Weight</span>
              <span class="text-sm font-semibold text-slate-900">${specs.copper_weight}</span>
            </div>
          `;

          // Render Gerber analysis
          if (specs.analysis === 'success') {
            document.getElementById('analysis-container').innerHTML = `
              <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                <div class="flex items-center gap-2 mb-3">
                  <iconify-icon icon="solar:check-circle-bold" width="20" class="text-green-600"></iconify-icon>
                  <span class="text-sm font-semibold text-green-900">Analysis Successful</span>
                </div>
                <div class="space-y-2">
                  <div class="flex justify-between text-sm">
                    <span class="text-green-700">Detected Layers:</span>
                    <span class="font-semibold text-green-900">${specs.layer_count}</span>
                  </div>
                  <div class="flex justify-between text-sm">
                    <span class="text-green-700">Board Size:</span>
                    <span class="font-semibold text-green-900">${specs.board_width_mm} × ${specs.board_height_mm} mm</span>
                  </div>
                  <div class="flex justify-between text-sm">
                    <span class="text-green-700">Board Area:</span>
                    <span class="font-semibold text-green-900">${specs.board_area_cm2} cm²</span>
                  </div>
                </div>
              </div>
            `;
          } else if (specs.analysis === 'partial') {
            document.getElementById('analysis-container').innerHTML = `
              <div class="bg-amber-50 border border-amber-200 rounded-lg p-4">
                <div class="flex items-center gap-2 mb-2">
                  <iconify-icon icon="solar:danger-triangle-linear" width="20" class="text-amber-600"></iconify-icon>
                  <span class="text-sm font-semibold text-amber-900">Partial Analysis</span>
                </div>
                <p class="text-xs text-amber-700">${specs.note || 'Some details could not be extracted from the Gerber file.'}</p>
                ${specs.layer_count ? `<p class="text-xs text-amber-700 mt-2">Detected ${specs.layer_count} layers</p>` : ''}
              </div>
            `;
          } else if (specs.analysis === 'no_file') {
            document.getElementById('analysis-card').style.display = 'none';
          } else {
            document.getElementById('analysis-container').innerHTML = `
              <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                <div class="flex items-center gap-2 mb-2">
                  <iconify-icon icon="solar:close-circle-linear" width="20" class="text-red-600"></iconify-icon>
                  <span class="text-sm font-semibold text-red-900">Analysis Failed</span>
                </div>
                <p class="text-xs text-red-700">Unable to analyze the Gerber file. Manual review required.</p>
              </div>
            `;
          }

          // Render pricing
          let pricingHTML = '';
          if (order.price > 0) {
            pricingHTML = `
              <div class="text-center py-4">
                <div class="text-3xl font-bold text-slate-900 mb-2">$${order.price.toFixed(2)}</div>
                <div class="text-sm text-slate-500">Final Price</div>
              </div>
            `;
            if (order.status === 'quoted') {
              pricingHTML += `
                <button class="w-full bg-green-600 text-white font-medium text-sm py-3 rounded-lg hover:bg-green-700 transition-colors mt-4">
                  Proceed to Payment
                </button>
              `;
            }
          } else if (order.estimated_price) {
            pricingHTML = `
              <div class="text-center py-4">
                <div class="text-2xl font-bold text-amber-600 mb-2">$${order.estimated_price.toFixed(2)}</div>
                <div class="text-xs text-slate-500">Estimated Price</div>
                <div class="text-xs text-slate-400 mt-2">Final price pending admin review</div>
              </div>
            `;
          } else {
            pricingHTML = `
              <div class="text-center py-4">
                <div class="text-sm text-slate-500">Price pending review</div>
              </div>
            `;
          }
          document.getElementById('pricing-container').innerHTML = pricingHTML;

          // Show download button if file exists
          if (order.gerber_file) {
            document.getElementById('download-card').style.display = 'block';
            document.getElementById('download-link').href = `${API_BASE}/uploads/${order.gerber_file}`;
          }

        } catch (error) {
          console.error('Error loading order:', error);
          document.getElementById('order-title').textContent = 'Order Not Found';
          document.getElementById('specs-container').innerHTML = '<div class="text-center py-8 text-red-600">Failed to load order details</div>';
        }
      }

      // Check auth and load
      if (!getToken()) {
        window.location.href = '/authorization.html';
      } else {
        loadOrderDetails();
      }
    </script>
</body>
</html>
